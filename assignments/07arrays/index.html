<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <title> JS Arrays</title>
</head>

<main>
    <h1>Assignment 10</h1>
    <h2>Arrays</h2>
    <div id="destination-pick">
        <div class="test-content">
            <label for="locations">Pick Your Destination Type: </label>
            <select id="locations">
                <option value="blank"></option>
                <option value="mountains">Mountains</option>
                <option value="beaches">Beaches</option>
            </select>
            <div id="mountain-choices">
                <a href="#" alt="Asheville Mountain" id="asheville">Asheville</a>
                <a href="#" alt="Boone Mountain" id="boone">Boone</a>
                <a href="#" alt="Hot Springs Mountain" id="hot-springs">Hot Springs</a>
                <a href="#" alt="Table Rock Mountain" id="table-rock">Table Rock</a>
            </div>
            <div id="beach-choices">
                <a href="#" alt="Folly Beach" id="folly">Folly</a>
                <a href="#" alt="Myrtle Beach" id="myrtle">Myrtle</a>
                <a href="#" alt="Kiawah Beach" id="kiawah">Kiawah</a>
                <a href="#" alt="Hilton Head" id="hilton-head">Hilton Head</a>
            </div>
        </div>
        <div id="googleMap"></div>
    </div>
    <script src="script.js"></script>
</main>
<footer><a href="https://github.com/sockrubbah/sockrubbah.github.io">@sockrubbah</a></footer>

</html>
