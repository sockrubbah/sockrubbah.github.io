<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Functions</title>
</head>

<body>
    <h1>Assignment 5</h1>
    <h2>Introduction to JavaScript</h2>
    <section class="assignment-grid">
        <div class="test-box">
            <h3>Speech</h3>
            <div class="test-content">
                <button class="speech-button"><div id="speech-bubble"><p>Hey!</p></div></button>
            </div>
        </div>
        <div class="test-box">
            <h3>Beverage</h3>
            <div class="test-content">
                <label for="drinks">Choose a beverage: </label>
                <select id="drinks">
                    <option value="blank"></option>
                    <option value="sprite">Sprite</option>
                    <option value="orange-juice">Orange Juice</option>
                    <option value="water">Water</option>
                </select>
                <p id="choice-sentence"><span id="choice"></span>: Nice Choice!</p>
            </div>
        </div>
        <div class="test-box">
            <h3>Add a Sticker</h3>
            <div class="test-content">
                <button id="sun-button"><img
                        src="images\a-cheerful-sun-with-a-beaming-smile-and-rosy-cheeks-radiating-warmth-and-happiness-is-isolated-on-a-transparent-background-png.webp"
                        alt="Smiling Sun" id="sun-img"></button>
                <img id="emoji"
                    src="images\a-cheerful-sun-with-a-beaming-smile-and-rosy-cheeks-radiating-warmth-and-happiness-is-isolated-on-a-transparent-background-png.webp"
                    alt="Smiling Sun" id="sun-img">
            </div>
        </div>
    </section>
    <script src="script.js"></script>
</body>

</html>
